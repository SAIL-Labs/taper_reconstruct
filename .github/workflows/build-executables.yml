# Windows build. Pushing a tag vX.Y.Z runs the tests, builds the recorder, packs it with
# Velopack and publishes a GitHub release holding:
#   TaperRecorder-win-Setup.exe        the installer (per user, Start menu, auto-updates)
#   TaperRecorder-X.Y.Z-full.nupkg,
#   releases.win.json, assets.win.json, RELEASES
#                                      what installed copies update from (keep them)
#   TaperRecorder-win-Portable.zip     the same app without installing (unzip and run;
#                                      it updates itself too)
# Running it by hand (Actions > Windows build > Run workflow) builds the same files as a
# workflow artifact only, without a release.
#
# The repository is public, so installed copies read releases without a token.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VPK_VERSION: "1.2.161"   # keep equal to the velopack version pinned in pyproject.toml

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Version
        run: |
          version=$(python -c "from taper_tools._version import __version__; print(__version__)")
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the app version ${version} (taper_tools/_version.py)"
            exit 1
          fi

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build app
        run: pyinstaller --noconfirm packaging/taper_recorder.spec

      - name: Pack installer (Velopack)
        run: |
          dotnet tool install -g vpk --version "${VPK_VERSION}"
          vpk pack --packId TaperRecorder --packVersion "${VERSION}" --packDir dist/TaperRecorder \
            --mainExe TaperRecorder.exe --packTitle "Taper Recorder" --packAuthors "SAIL Labs" \
            --outputDir Releases
          ls -l Releases

      - uses: actions/upload-artifact@v4
        with:
          name: TaperRecorder-${{ env.VERSION }}-windows
          path: Releases/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Releases/* --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" Releases/* --clobber
